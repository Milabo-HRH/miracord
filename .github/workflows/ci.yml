name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13'
            requirements: requirements.txt
          - python: '3.11'
            requirements: requirements-pipecat.txt
    env:
      # Dummy values for config validation (tests use mocks, not real connections)
      DISCORD_TOKEN: "test_token_for_ci"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libportaudio2

      - name: Install Python dependencies
        run: pip install -r ${{ matrix.requirements }} -r requirements-dev.txt

      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t miracord .
